name: Generate contribution snake

on:
  # every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # lets you run it by hand from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.gif?color_snake=#41B883&color_dots=#ebedf0,#bfd6f6,#8dbdff,#4b91f1,#3178c6&color_background=#ffffff
            dist/github-snake-dark.gif?color_snake=#41B883&color_dots=#161b22,#1f3b5c,#2a5d99,#3178c6,#00B8D9&color_background=#0d1117

      # publishes dist/ to the `output` branch, readable at
      # https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
