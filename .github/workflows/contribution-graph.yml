name: Generate contribution graph

on:
  # every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # lets you run it by hand from the Actions tab
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Render the calendar
        run: |
          mkdir -p dist
          python3 .github/scripts/contribution_graph.py "${{ github.repository_owner }}" dist

      # publishes dist/ to the `output` branch, readable at
      # https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
